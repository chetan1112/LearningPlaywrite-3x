<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Table Practice</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #888; padding: 14px; text-align: left; }
    th { background: #e3efff; }
    caption { text-align: left; font-weight: bold; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>My Classroom Attendance</h1>
  <p>A row goes sideways. A column goes up and down. A cell is one box.</p>
  <table>
    <caption>Attendance</caption>
    <thead>
      <tr><th scope="col">Name</th><th scope="col">Class</th><th scope="col">Status</th></tr>
    </thead>
    <tbody>
      <tr><td>Ravi</td><td>5</td><td>Present</td></tr>
      <tr><td>Anu</td><td>5</td><td>Absent</td></tr>
      <tr><td>Sam</td><td>6</td><td>Present</td></tr>
    </tbody>
  </table>
  <p>Playwright counts from 0: Name = 0, Class = 1, Status = 2.</p>
</body>
</html>
